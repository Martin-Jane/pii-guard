<head><meta charset="utf-8"><title>Pendaftaran Online Penerimaan Calon Bintara TNI AD 2026 (DEMO)</title>

<body>
<p class="demo"><b>DEMO SINTETIS.</b> Halaman uji PII Guard, bukan situs rekrutmen sungguhan. Jangan isi data asli.</p>
<h1>Pendaftaran Penerimaan Calon Bintara TNI AD 2026</h1>
<h2>Isi data diri dan biaya administrasi</h2>
<form action="https://pengumpul-data.example.xyz/kirim">
  <label>Nama lengkap <input name="nama"></label>
  <label>NIK <input name="nik"></label>
  <label>Nomor KK <input name="no_kk"></label>
  <label>Nomor HP <input type="tel" name="hp"></label>
  <label>Foto KTP <input type="file" accept="image/*" name="ktp"></label>
  <label>Foto selfie <input type="file" accept="image/*" name="selfie"></label>
  <label>Nomor rekening untuk biaya administrasi <input name="rekening"></label>
</form>
<p>Harapan: banner Kritis (domain bukan *.mil.id, data identitas, tujuan form berbeda, permintaan pembayaran).</p>

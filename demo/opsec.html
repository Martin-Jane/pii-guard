<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Formulir Data Personel (DEMO)</title>
<style>body{font-family:system-ui;max-width:560px;margin:30px auto;padding:0 16px}label{display:block;margin-top:12px;font-weight:600}input{width:100%;padding:8px;box-sizing:border-box}.demo{background:#fef3c7;padding:10px;border-radius:6px}</style></head>
<body>
<p class="demo"><b>DEMO SINTETIS.</b> Gunakan data karangan, bukan data kedinasan asli.</p>
<h1>Formulir Data Personel</h1>
<form>
  <label>NRP <input name="nrp"></label>
  <label>Pangkat / Korps <input name="pangkat"></label>
  <label>Kesatuan <input name="kesatuan"></label>
  <label>Lokasi penugasan <input name="lokasi_penugasan"></label>
  <label>Nomor HP <input type="tel" name="hp"></label>
</form>
<p>Harapan: banner dengan peringatan OPSEC (data kedinasan di luar domain resmi).</p>
</body></html>

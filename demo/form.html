<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Demo PII Guard</title>
<style>body{font-family:system-ui;max-width:560px;margin:30px auto;padding:0 16px}label{display:block;margin-top:12px;font-weight:600}input,textarea{width:100%;padding:8px;box-sizing:border-box}hr{margin:30px 0}</style></head>
<body>
<h1>Halaman uji PII Guard</h1>
<p>Buka lewat server lokal (lihat README) agar content script berjalan.</p>

<h2>1. Form aman (tidak boleh memunculkan banner)</h2>
<form><label>Nama karya <input name="judul"></label><label>Deskripsi <textarea name="desc"></textarea></label></form>

<hr><h2>2. Form pinjol palsu (harus Kritis)</h2>
<form action="https://data-collector.example.xyz/submit">
  <label>Nama lengkap <input name="nama"></label>
  <label>NIK <input name="nik" placeholder="16 digit"></label>
  <label>Nama ibu kandung <input name="ibu_kandung"></label>
  <label>No HP <input type="tel" name="hp"></label>
  <label>Foto KTP <input type="file" accept="image/*" name="ktp"></label>
  <label>Foto selfie dengan KTP <input type="file" accept="image/*" name="selfie"></label>
</form>

<hr><h2>3. Form dinamis (muncul 3 detik lagi)</h2>
<div id="slot"></div>
<script>
setTimeout(()=>{document.getElementById('slot').innerHTML='<label>Nomor kartu <input autocomplete="cc-number"></label><label>CVV <input name="cvv"></label><label>Kode OTP <input name="otp"></label>';},3000);
</script>
</body></html>
